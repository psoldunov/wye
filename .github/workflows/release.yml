name: Release

# Merging the version bump is the release. When a push to master changes the
# workspace version in Cargo.toml and no tag `vX.Y.Z` exists yet, the
# workflow
#
# - runs `nix flake check` on x86_64 and aarch64 (flake-check.yml), which
#   builds the package and the browser extension of this commit, the same
#   derivations `programs.wye.channel = "release"` builds, and pushes them to
#   Cachix (when the token is set) so that install substitutes;
# - builds and smoke-tests the .deb, the .rpm and the AppImage for both
#   architectures (packages.yml), alongside the flake check;
# - publishes the GitHub release with the six packages, the three browser
#   extension zips and SHA256SUMS, which creates the tag `vX.Y.Z` on the
#   commit;
# - commits nix/release.json to master, which is what
#   `programs.wye.channel = "release"` installs.
#
# Nothing is published, and no tag created, unless the flake check and all
# six packages pass. After a failure, re-run the failed jobs, or fix master
# and run this workflow from the Actions tab (`gh workflow run release.yml`):
# it releases master's version when that tag does not exist yet.
on:
  push:
    branches: [master]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      rev: ${{ steps.version.outputs.rev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit before the push, to compare its version.
          fetch-depth: 0

      - name: Release when the version changed and has no tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          workspace_version() {
            awk '/^\[workspace\.package\]/ { in_section = 1; next } /^\[/ { in_section = 0 } in_section && /^version *=/ { gsub(/[" ]/, "", $3); print $3; exit }'
          }
          version=$(workspace_version < Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no workspace version in Cargo.toml"
            exit 1
          fi
          release=true
          if [ "$EVENT" = push ] && previous=$(git show "$BEFORE:Cargo.toml" 2> /dev/null) &&
            [ "$(workspace_version <<< "$previous")" = "$version" ]; then
            echo "the workspace version is still $version; nothing to release"
            release=false
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            release=false
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "rev=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  flake-check:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/flake-check.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  packages:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml

  release:
    needs: [check, flake-check, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: psoldunov

      # The extension zips do not depend on the architecture. The flake
      # check built them (extension-manifests), so this substitutes: the
      # Firefox build, the Chromium build with its key, and the Chromium
      # build without it that the Chrome Web Store takes.
      - name: Collect the extension zips
        env:
          REF: github:${{ github.repository }}/${{ needs.check.outputs.rev }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          out=$(nix build -L --no-link --print-out-paths "$REF#extension")
          mkdir -p packages
          for name in firefox chromium chromium-webstore; do
            install -m 644 "$out/share/wye/extension/wye-extension-${name}.zip" \
              "packages/wye-extension-${name}-${VERSION}.zip"
          done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Check the packages and extension zips, write SHA256SUMS
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          cd packages
          for file in \
            "wye_${VERSION}_amd64.deb" "wye_${VERSION}_arm64.deb" \
            "wye-${VERSION}-1.fc44.x86_64.rpm" "wye-${VERSION}-1.fc44.aarch64.rpm" \
            "Wye-${VERSION}-x86_64.AppImage" "Wye-${VERSION}-aarch64.AppImage" \
            "wye-extension-firefox-${VERSION}.zip" "wye-extension-chromium-${VERSION}.zip" \
            "wye-extension-chromium-webstore-${VERSION}.zip"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing; the packages are:" *
              exit 1
            fi
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          REV: ${{ needs.check.outputs.rev }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # A re-run finds the release of an earlier attempt: its notes stay
          # as they are, its packages and extension zips are replaced.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release $tag exists; uploading the packages and extension zips again"
            gh release upload "$tag" packages/* --clobber
            exit 0
          fi
          # gh creates the release as a draft, uploads the files, then
          # publishes it, which creates the tag on $REV, so neither the
          # release nor the tag appears without its packages and extension
          # zips. The notes below go before the generated ones.
          cat > notes.md <<EOF
          ## Packages

          Each for x86_64 and aarch64 (arm64):

          - Debian testing and sid: \`wye_${VERSION}_amd64.deb\`, \`wye_${VERSION}_arm64.deb\`
          - Fedora 44: \`wye-${VERSION}-1.fc44.x86_64.rpm\`, \`wye-${VERSION}-1.fc44.aarch64.rpm\`
          - Any other distribution: \`Wye-${VERSION}-x86_64.AppImage\`, \`Wye-${VERSION}-aarch64.AppImage\`, which sets up its menu entry and D-Bus files under \`~/.local\` when it starts
          - NixOS and home-manager: \`programs.wye.channel = "release"\` installs this release once \`nix/release.json\` records it

          ## Browser extension

          The zips of the extension for Firefox and Chromium-family browsers, the same for every architecture:

          - Firefox: \`wye-extension-firefox-${VERSION}.zip\`
          - Chromium, Chrome, Brave, Vivaldi, Edge: \`wye-extension-chromium-${VERSION}.zip\` (unzip it and load it unpacked)
          - \`wye-extension-chromium-webstore-${VERSION}.zip\` is the Chromium build without its \`key\`, which is the upload for the Chrome Web Store

          Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`. Installation: [README](https://github.com/${GH_REPO}/blob/${tag}/README.md#install), [packaging/README.md](https://github.com/${GH_REPO}/blob/${tag}/packaging/README.md).
          EOF
          gh release create "$tag" packages/* --target "$REV" --title "Wye ${VERSION}" \
            --notes-file notes.md --generate-notes

  record:
    needs: [check, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # A push with GITHUB_TOKEN starts no workflow, so this commit runs
      # neither CI nor this workflow again.
      - name: Commit the release to nix/release.json on master
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          REV: ${{ needs.check.outputs.rev }}
        run: |
          set -euo pipefail
          # The content hash of the released tree, exactly as a locked
          # `github:psoldunov/wye/<rev>?narHash=…` reference names it.
          narHash=$(nix flake prefetch --json "github:${GH_REPO}/${REV}" | jq -r .hash)
          if [ -z "$narHash" ] || [ "$narHash" = null ]; then
            echo "::error::could not prefetch github:${GH_REPO}/${REV}"
            exit 1
          fi
          jq -n --arg version "$VERSION" --arg rev "$REV" --arg narHash "$narHash" \
            '{version: $version, rev: $rev, narHash: $narHash}' > nix/release.json
          if git diff --quiet -- nix/release.json; then
            echo "nix/release.json already records v${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record release v${VERSION} in nix/release.json" -- nix/release.json
          # Master may have moved since the checkout.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "push $attempt failed; rebasing on master"
            git pull --rebase origin master
          done
          echo "::error::could not push nix/release.json to master"
          exit 1
