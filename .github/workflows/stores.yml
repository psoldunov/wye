name: Stores

# Submits a published release's browser extension to addons.mozilla.org and
# the Chrome Web Store with frontends/extension/store/submit.sh, which
# uploads the release's own zips and leaves a version a store already has
# alone. The release workflow calls this one once the release is published;
# it also runs from the Actions tab for any released version
# (`gh workflow run stores.yml -f version=X.Y.Z`). A store whose secrets are
# not set is skipped with a notice. Both stores review the version and
# publish it when the review passes. The secrets and the Google Cloud setup:
# frontends/extension/store/README.md, "Submitting a version".
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      AMO_JWT_ISSUER:
        required: false
      AMO_JWT_SECRET:
        required: false
      CWS_PUBLISHER_ID:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: A released version, X.Y.Z
        type: string
        required: true

permissions:
  contents: read

jobs:
  configured:
    name: Configured stores
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      amo: ${{ steps.check.outputs.amo }}
      chrome: ${{ steps.check.outputs.chrome }}
    steps:
      - id: check
        env:
          VERSION: ${{ inputs.version }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version $VERSION is not X.Y.Z"
            exit 1
          fi
          amo=true
          chrome=true
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::notice::AMO_JWT_ISSUER and AMO_JWT_SECRET are not set; addons.mozilla.org is skipped"
            amo=false
          fi
          if [ -z "$CWS_PUBLISHER_ID" ]; then
            echo "::notice::CWS_PUBLISHER_ID is not set; the Chrome Web Store is skipped"
            chrome=false
          fi
          {
            echo "amo=$amo"
            echo "chrome=$chrome"
          } >> "$GITHUB_OUTPUT"

  amo:
    name: addons.mozilla.org
    needs: configured
    if: needs.configured.outputs.amo == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Firefox zip of the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --dir dist \
            --pattern "wye-extension-firefox-${VERSION}.zip" --pattern SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS --ignore-missing)

      - name: Submit it
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ inputs.version }}
        run: frontends/extension/store/submit.sh amo "dist/wye-extension-firefox-${VERSION}.zip" "$VERSION"

  chrome-web-store:
    name: Chrome Web Store
    needs: configured
    if: needs.configured.outputs.chrome == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # GitHub's OIDC token, which Workload Identity Federation exchanges for
      # a short-lived token of the service account: no key exists.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Chrome Web Store zip of the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --dir dist \
            --pattern "wye-extension-chromium-webstore-${VERSION}.zip" --pattern SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS --ignore-missing)

      # The provider accepts only this repository's runs on master.
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/936592312146/locations/global/workloadIdentityPools/github/providers/wye-github
          service_account: wye-release@wye-release-1c3351.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Submit it
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          frontends/extension/store/submit.sh chrome \
            "dist/wye-extension-chromium-webstore-${VERSION}.zip" "$VERSION"
