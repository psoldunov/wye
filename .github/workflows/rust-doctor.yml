name: rust-doctor

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  rust-doctor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only for the sticky pull request comment; fork pull requests get a
      # read-only token and a warning instead.
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Baseline scope compares a pull request against its base.
          fetch-depth: 0
      # Pull requests fail only on what they introduce; pushes to master report
      # without failing.
      # The action.yml exists only on main so far (no release tag carries it,
      # and the `v0` ref the README names does not exist), so this pins main.
      - uses: arthjean/rust-doctor@9b8c0ab7b67a4fce5c04599e050a11a4d47add2c # main
        with:
          blocking: warning
          comment: "true"
