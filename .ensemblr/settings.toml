#:schema https://www.ensemblr.dev/schemas/settings.schema.json

[scripts]
setup = "nix develop -c cargo fetch --locked"

[scripts.run.test]
command = "nix develop -c cargo test --workspace --locked"
icon = "test-tube"
default = true

# The same gates as the first two review gates in AGENTS.md.
[scripts.run.lint]
command = "nix develop -c sh -c 'cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- --deny warnings'"
icon = "list-checks"

# Static review: rust-doctor needs no new findings. See AGENTS.md.
[scripts.run.doctor]
command = "nix develop -c rust-doctor --yes --blocking warning"
icon = "shield-check"

[scripts.run.build]
command = "nix build -L"
icon = "hammer"

# Runs the same checks as the CI flake-check job.
[scripts.run.ci-check]
command = "nix flake check -L --keep-going"
icon = "badge-check"
