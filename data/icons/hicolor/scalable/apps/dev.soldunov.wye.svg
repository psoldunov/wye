<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Wye app icon, 1024 master.
    Grid: 824 plate inset 100 (app-icon template); continuous-corner squircle, radius 185.4,
    corner smoothing 0.6. Glyph: a Y junction drawn with a 112 stroke (pixel-aligned at 128/256/512).
    The lit route (stem and right arm) is the link's chosen destination; the tinted left arm is
    the other way it could have gone. No filters: shadows are stacked translucent strokes.
  -->
  <defs>
    <path id="plate-shape" d="M627.4 100c103.8 0 155.8 0 195.4 20.2a185.4 185.4 0 0 1 81 81c20.2 39.7 20.2 91.6 20.2 195.4V627.4c0 103.8 0 155.8-20.2 195.4a185.4 185.4 0 0 1-81 81c-39.7 20.2-91.6 20.2-195.4 20.2H396.6c-103.8 0-155.8 0-195.4-20.2a185.4 185.4 0 0 1-81-81c-20.2-39.7-20.2-91.6-20.2-195.4V396.6c0-103.8 0-155.8 20.2-195.4a185.4 185.4 0 0 1 81-81c39.7-20.2 91.6-20.2 195.4-20.2Z"/>
    <path id="route-line" d="M512 782V693C512 594 553.5 476.7 615.8 399.7L690 308"/>
    <path id="branch-line" d="M512 693C512 594 470.5 476.7 408.2 399.7L334 308"/>
    <linearGradient id="plate-fill" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fd0ea"/>
      <stop offset=".55" stop-color="#1f9ae8"/>
      <stop offset="1" stop-color="#2458dc"/>
    </linearGradient>
    <linearGradient id="plate-sheen" x1="0" y1="100" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate-edge" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".25" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".75" stop-color="#0a1a66" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a1a66" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="route-fill" x1="0" y1="252" x2="0" y2="838" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#dfeaff"/>
    </linearGradient>
    <linearGradient id="branch-rim" x1="0" y1="252" x2="0" y2="693" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcf7ff"/>
      <stop offset="1" stop-color="#7ab8f6"/>
    </linearGradient>
    <linearGradient id="branch-fill" x1="0" y1="252" x2="0" y2="693" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a2e1fb"/>
      <stop offset="1" stop-color="#78b6f6"/>
    </linearGradient>
  </defs>
  <g id="plate-shadow" fill="#0a1a66">
    <use xlink:href="#plate-shape" y="4" opacity=".08"/>
    <use xlink:href="#plate-shape" y="8" opacity=".06"/>
    <use xlink:href="#plate-shape" y="14" opacity=".04"/>
    <use xlink:href="#plate-shape" y="22" opacity=".025"/>
  </g>
  <g id="plate">
    <use xlink:href="#plate-shape" fill="url(#plate-fill)"/>
    <use xlink:href="#plate-shape" fill="url(#plate-sheen)"/>
    <path id="plate-rim" d="M629.8 104c101.6 0 152.4 0 191.2 19.8a181.4 181.4 0 0 1 79.3 79.3c19.8 38.8 19.8 89.6 19.8 191.2V629.8c0 101.6 0 152.4-19.8 191.2a181.4 181.4 0 0 1-79.3 79.3c-38.8 19.8-89.6 19.8-191.2 19.8H394.2c-101.6 0-152.4 0-191.2-19.8a181.4 181.4 0 0 1-79.3-79.3c-19.8-38.8-19.8-89.6-19.8-191.2V394.2c0-101.6 0-152.4 19.8-191.2a181.4 181.4 0 0 1 79.3-79.3c38.8-19.8 89.6-19.8 191.2-19.8Z" fill="none" stroke="url(#plate-edge)" stroke-width="8"/>
  </g>
  <g id="glyph" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="branch-shadow" stroke="#0a1a66" transform="translate(0 14)">
      <use xlink:href="#branch-line" stroke-width="168" stroke-opacity=".008"/>
      <use xlink:href="#branch-line" stroke-width="158" stroke-opacity=".009"/>
      <use xlink:href="#branch-line" stroke-width="148" stroke-opacity=".011"/>
      <use xlink:href="#branch-line" stroke-width="139" stroke-opacity=".013"/>
      <use xlink:href="#branch-line" stroke-width="130" stroke-opacity=".015"/>
      <use xlink:href="#branch-line" stroke-width="121" stroke-opacity=".017"/>
      <use xlink:href="#branch-line" stroke-width="112" stroke-opacity=".02"/>
    </g>
    <use id="branch-glass" xlink:href="#branch-line" stroke="url(#branch-rim)" stroke-width="112"/>
    <use id="branch" xlink:href="#branch-line" stroke="url(#branch-fill)" stroke-width="102"/>
    <g id="route-shadow" stroke="#0a1a66" transform="translate(0 14)">
      <use xlink:href="#route-line" stroke-width="168" stroke-opacity=".016"/>
      <use xlink:href="#route-line" stroke-width="158" stroke-opacity=".018"/>
      <use xlink:href="#route-line" stroke-width="148" stroke-opacity=".022"/>
      <use xlink:href="#route-line" stroke-width="139" stroke-opacity=".026"/>
      <use xlink:href="#route-line" stroke-width="130" stroke-opacity=".03"/>
      <use xlink:href="#route-line" stroke-width="121" stroke-opacity=".034"/>
      <use xlink:href="#route-line" stroke-width="112" stroke-opacity=".04"/>
    </g>
    <use id="route" xlink:href="#route-line" stroke="url(#route-fill)" stroke-width="112"/>
  </g>
</svg>
