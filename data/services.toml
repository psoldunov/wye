# Web app catalogue for the Apps page (APP-07, docs/spec/06-apps.md).
#
# One entry per service. Services stay in the list even without a Linux
# desktop app, because routing a service to a browser or profile is useful on
# its own. Desktop IDs, Flatpak IDs and URL schemes are candidates that must be
# verified before release (docs/spec/14-open-questions.md, "Items to verify").
#
# id:           stable key used in the configuration file ([apps] <id> = …)
# hosts:        a host and its subdomains
# paths:        optional path prefixes; empty means every path
# desktop-apps: desktop IDs of the service's own app (distro, Flatpak, Snap)
# hand-over:    "pass-through" (the https link as is), "spotify-uri"
#               (open.spotify.com/track/<id> → spotify:track:<id>) or
#               "steam-openurl" (steam://openurl/<link>)

[[service]]
id = "airtable"
name = "Airtable"
hosts = ["airtable.com"]

[[service]]
id = "amazon-chime"
name = "Amazon Chime"
hosts = ["chime.aws"]

[[service]]
id = "around"
name = "Around"
hosts = ["around.co"]

[[service]]
id = "asana"
name = "Asana"
