# cargo-deny policy. Licences, bans and sources run offline as the `deny` flake
# check; advisories need the RustSec database from the network, so CI runs them
# as a separate job (`cargo deny check advisories`).

[graph]
# Only the platforms Wye ships for, so Windows-only crates do not drag their
# licences into the check.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
]

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  # foldhash (via cxx, cxx-qt and hashbrown).
  "Zlib",
]
confidence-threshold = 0.8

# File watchers in the service (config reload, mimeapps.list, application
# dirs): notify is CC0-1.0, its Linux backend inotify is ISC. Scoped to these
# crates rather than allowed globally.
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
crate = "inotify"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "inotify-sys"
allow = ["ISC"]

# HTTP for short-link expansion and Songlink (decision 7: ureq with rustls).
# ring and the webpki crates are ISC (ring also Apache-2.0), subtle is
# BSD-3-Clause, and ureq's `rustls` feature brings the Mozilla root list
# (CDLA-Permissive-2.0) even though Wye verifies with the platform's store.
[[licenses.exceptions]]
crate = "ring"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "untrusted"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "subtle"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# The GTK host (wye-gtk): gtk-rs's -sys crates find GTK through system-deps,
# whose cfg-expr parses target triples with target-lexicon, a build-time
# dependency under Apache-2.0 with the LLVM exception.
[[licenses.exceptions]]
crate = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
