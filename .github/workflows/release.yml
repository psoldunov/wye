name: Release

# Push a tag `vX.Y.Z` that names the workspace version in Cargo.toml, on a
# master commit. The workflow
#
# - builds the tagged flake for x86_64 and aarch64, exactly as
#   `programs.wye.channel = "release"` fetches it, and pushes the result to
#   Cachix (when the token is set) so that install substitutes;
# - builds and smoke-tests the .deb, the .rpm and the AppImage for both
#   architectures (packages.yml);
# - publishes the GitHub release with the six packages and SHA256SUMS;
# - opens a pull request that records the release in nix/release.json, which
#   is what `programs.wye.channel = "release"` installs.
#
# Nothing here creates a tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      rev: ${{ steps.version.outputs.rev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag must be on master; that needs the branch history.
          fetch-depth: 0

      - name: Check the tag against Cargo.toml and master
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(awk '/^\[workspace\.package\]/ { in_section = 1; next } /^\[/ { in_section = 0 } in_section && /^version *=/ { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no workspace version in Cargo.toml"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version v$version in Cargo.toml"
            exit 1
          fi
          rev=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$rev" origin/master; then
            echo "::error::tag $TAG ($rev) is not on master"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

  nix:
    name: nix build (${{ matrix.arch }})
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: psoldunov
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The tagged commit fetched from GitHub, as nix/release.nix names it,
      # so the derivation is the one `programs.wye.channel = "release"`
      # builds; the cache push is what makes that install fast.
      - name: nix build
        env:
          REF: github:${{ github.repository }}/${{ needs.check.outputs.rev }}
        run: nix build -L --no-link "$REF"

  packages:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml

  release:
    needs: [check, nix, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Check the packages, write SHA256SUMS
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          cd packages
          for file in \
            "wye_${VERSION}_amd64.deb" "wye_${VERSION}_arm64.deb" \
            "wye-${VERSION}-1.fc44.x86_64.rpm" "wye-${VERSION}-1.fc44.aarch64.rpm" \
            "Wye-${VERSION}-x86_64.AppImage" "Wye-${VERSION}-aarch64.AppImage"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing; the packages are:" *
              exit 1
            fi
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # A re-run finds the release of an earlier attempt: its notes stay
          # as they are, its packages are replaced.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG exists; uploading the packages again"
            gh release upload "$TAG" packages/* --clobber
            exit 0
          fi
          # gh creates the release as a draft, uploads the files, then
          # publishes it, so it never appears without its packages. The
          # notes below go before the generated ones.
          cat > notes.md <<EOF
          ## Packages

          Each for x86_64 and aarch64 (arm64):

          - Debian testing and sid: \`wye_${VERSION}_amd64.deb\`, \`wye_${VERSION}_arm64.deb\`
          - Fedora 44: \`wye-${VERSION}-1.fc44.x86_64.rpm\`, \`wye-${VERSION}-1.fc44.aarch64.rpm\`
          - Any other distribution: \`Wye-${VERSION}-x86_64.AppImage\`, \`Wye-${VERSION}-aarch64.AppImage\`, which sets up its menu entry and D-Bus files under \`~/.local\` when it starts
          - NixOS and home-manager: \`programs.wye.channel = "release"\` installs this release once \`nix/release.json\` records it

          Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`. Installation: [README](https://github.com/${GH_REPO}/blob/${TAG}/README.md#install), [packaging/README.md](https://github.com/${GH_REPO}/blob/${TAG}/packaging/README.md).
          EOF
          gh release create "$TAG" packages/* --verify-tag --title "Wye ${VERSION}" \
            --notes-file notes.md --generate-notes

  record:
    needs: [check, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Open a pull request that records the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          REV: ${{ needs.check.outputs.rev }}
        run: |
          set -euo pipefail
          # The content hash of the tagged tree, exactly as a locked
          # `github:psoldunov/wye/<rev>?narHash=…` reference names it.
          narHash=$(nix flake prefetch --json "github:${GH_REPO}/${REV}" | jq -r .hash)
          if [ -z "$narHash" ] || [ "$narHash" = null ]; then
            echo "::error::could not prefetch github:${GH_REPO}/${REV}"
            exit 1
          fi
          jq -n --arg version "$VERSION" --arg rev "$REV" --arg narHash "$narHash" \
            '{version: $version, rev: $rev, narHash: $narHash}' > nix/release.json
          if git diff --quiet -- nix/release.json; then
            echo "nix/release.json already records $TAG"
            exit 0
          fi
          branch="release/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add nix/release.json
          git commit -m "chore: record release ${TAG} in nix/release.json"
          # A re-run finds the branch (and maybe the pull request) of an
          # earlier attempt: replace the branch, reuse the pull request.
          remote=$(git ls-remote --heads origin "$branch" | cut -f1)
          git push --force-with-lease="refs/heads/${branch}:${remote}" origin "HEAD:refs/heads/${branch}"
          if gh pr view "$branch" --json state --jq .state 2> /dev/null | grep -qx OPEN; then
            echo "pull request for $branch is open; its branch was updated"
            exit 0
          fi
          gh pr create --base master --head "$branch" \
            --title "chore: record release ${TAG}" \
            --body "Points \`programs.wye.channel = \"release\"\` at ${TAG} (${REV}). Opened by the release workflow. Pull requests opened with GITHUB_TOKEN do not start CI; close and reopen this one, or push to it, to run the checks."
