<!doctype html>
<!-- BEXT-06: shown by the toolbar button while the native host is missing. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Wye</title>
    <link rel="stylesheet" href="pages.css">
  </head>
  <body class="popup">
    <h1>Wye's helper is not installed</h1>
    <p>
      The extension talks to Wye through a small helper program that Wye
      installs. Install Wye, then run this in a terminal and restart the
      browser:
    </p>
    <pre>wye-native-host --install</pre>
    <p>
      Browsers installed as Flatpak or Snap cannot reach it.
      <a href="https://github.com/psoldunov/wye/tree/master/frontends/extension#readme"
         target="_blank" rel="noopener">Setup instructions</a>
    </p>
    <p><button id="check" type="button">Check Again</button> <span id="status" role="status"></span></p>
    <script src="popup.js"></script>
  </body>
</html>
