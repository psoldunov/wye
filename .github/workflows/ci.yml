name: CI

# The quick checks every pull request and every push to master run. The
# `nix flake check` runs for releases only (flake-check.yml, called by
# release.yml), and rust-doctor.yml runs beside this one.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels the run of its older one; master's
# runs are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The RustSec database is fetched at run time, which the `nix flake check`
  # sandbox cannot do. A newly published advisory can fail this job without a
  # code change; fix it by updating the crate or listing it in deny.toml.
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: cargo deny check advisories
        run: nix shell --inputs-from . nixpkgs#cargo nixpkgs#cargo-deny -c cargo deny --locked check advisories
