name: rust-doctor

on:
  push:
    branches: [master]
  pull_request:

# The job needs no more than a read-only token. It posts no pull request
# comment: the third-party `arthjean/rust-doctor` action that did needed
# `pull-requests: write` while it ran `dtolnay/rust-toolchain@master`,
# `actions/upload-artifact@v4` and an unlocked `npm install`. This workflow
# installs the pinned CLI from crates.io with `--locked` instead and reads the
# result from the job log and exit status.
permissions:
  contents: read

jobs:
  rust-doctor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # The installed binary is cached under a key that names its version, so
      # a bump of `rust-doctor@` below needs a new key here.
      - name: Cache rust-doctor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rust-doctor
          key: rust-doctor-0.7.0-${{ runner.os }}

      # Nearly all of the job's time is the `cargo clippy --workspace` that
      # rust-doctor runs into `target/`, compiling every dependency and build
      # script (cxx-qt's C++, QuickJS) from scratch; `nix develop` itself takes
      # about half a minute. Keeping `target/` between runs leaves only the
      # crates that changed to check. The toolchain comes from the flake, so a
      # `flake.lock` change starts an empty cache (the old artifacts would never
      # be read again), while a `Cargo.lock` change starts from the previous one.
      - name: Cache target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-doctor-target-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-doctor-target-${{ runner.os }}-${{ hashFiles('flake.lock') }}-

      # Scans the whole workspace and fails on any blocking warning, the same
      # command AGENTS.md gives contributors. `--scope baseline` (fail only on
      # what a pull request introduces) is not used: rust-doctor 0.7.0 runs
      # `rustup show active-toolchain` in the base checkout, and the flake's
      # dev shell has no rustup (a rustup shim would replace its cargo).
      # Running inside `nix develop` also gives wye-ui's build script what
      # it needs: Qt and KDE Frameworks, QMAKE pointing at the merged Qt
      # prefix (set by the shell hook) and the wrapped ld.lld. Incremental
      # compilation is off: its session data would make the cached `target/`
      # much bigger for little gain on a run that checks each crate once.
      - name: rust-doctor
        env:
          CARGO_INCREMENTAL: 0
        run: |
          nix develop -c sh -c '
            set -eu
            bin="$RUNNER_TEMP/rust-doctor/bin/rust-doctor"
            if [ ! -x "$bin" ]; then
              cargo install --locked rust-doctor@0.7.0 --root "$RUNNER_TEMP/rust-doctor"
            fi
            "$bin" --yes --blocking warning
          '
